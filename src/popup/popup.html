<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Workspace Manager</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div>
      <strong id="workspaceTitle">Workspace Manager</strong>
      <div id="workspaceSubtitle" class="popup-subtitle">Workspace Manager</div>
    </div>
    <button id="refresh" type="button" title="Obnovit">↻</button>
  </header>

  <main>
    <section id="stats" class="stats">Načítám…</section>
    <section class="actions">
      <button id="recoverSession" class="recover-session" type="button" hidden>Recover session</button>
      <button id="openManager" type="button">Otevřít správce</button>
      <button id="deepAll" type="button">DEEP ALL</button>
    </section>
  </main>
  <footer id="version" class="version"></footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
