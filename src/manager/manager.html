<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Firefox Workspace Manager</title>
  <link rel="stylesheet" href="manager.css">
</head>
<body>
  <header>
    <div>
      <h1>Firefox Workspace Manager</h1>
      <div id="summary" class="summary">Načítám…</div>
    </div>
    <div class="actions">
      <button id="settingsToggle" type="button">Nastavení</button>
      <button id="deepAll" type="button">DEEP ALL EXCEPT ACTIVE</button>
      <button id="refresh" type="button">Obnovit</button>
    </div>
  </header>
  <section id="settingsPanel" class="settings-panel" hidden>
    <div class="settings-inner">
      <h2>Politiky podle hostname</h2>
      <p>Pravidlo se vztahuje na celý host, např. <code>maps.zlkl.cz</code>, ne na jednotlivou záložku.</p>
      <div id="hostPolicies">Načítám…</div>
    </div>
  </section>
  <main id="app">Načítám…</main>
  <script src="manager.js"></script>
</body>
</html>
